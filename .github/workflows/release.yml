name: Release Marmota

# Esto indica que el servidor solo arrancará cuando crees un Tag que empiece por 'v'
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Matriz de sistemas operativos: Linux, Windows, macOS
      matrix:
        os: [ ubuntu-22.04, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Wails en Linux necesita las cabeceras de GTK y WebKit para compilar
      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev imagemagick alien

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # 1. Compilación para Windows
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          wails build
          mv build/bin/Marmota.exe "build/bin/Marmota_${{ github.ref_name }}_Windows_amd64.exe"

      # 2. Compilación para macOS (Universal)
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform darwin/universal
          cd build/bin
          zip -r "Marmota_${{ github.ref_name }}_macOS_Universal.zip" *.app
          rm -rf *.app

      # 3. Compilación nativa para Linux (.deb y .rpm)
      - name: Build Linux Native Packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          wails build

          mkdir -p deb_pkg/usr/bin
          mkdir -p deb_pkg/usr/share/applications
          mkdir -p deb_pkg/usr/share/icons/hicolor/512x512/apps
          mkdir -p deb_pkg/DEBIAN

          cp build/bin/Marmota deb_pkg/usr/bin/marmota
          convert build/appicon.png -resize 512x512 deb_pkg/usr/share/icons/hicolor/512x512/apps/marmota.png

          echo -e "[Desktop Entry]\nName=Marmota\nExec=/usr/bin/marmota\nIcon=marmota\nType=Application\nCategories=Development;Network;Security;" > deb_pkg/usr/share/applications/marmota.desktop

          echo -e "Package: marmota\nVersion: ${VERSION}\nArchitecture: amd64\nMaintainer: Release Marmota <marmota@github.com>\nDescription: A cross-platform HTTP/HTTPS MITM proxy and network analyzer.\nDepends: libwebkit2gtk-4.0-37" > deb_pkg/DEBIAN/control

          DEB_NAME="marmota_${VERSION}_amd64.deb"
          dpkg-deb --build deb_pkg "build/bin/${DEB_NAME}"

          cd build/bin
          sudo alien --to-rpm --scripts "${DEB_NAME}"
          rm Marmota

      # Sube los binarios compilados (.exe, .deb y .rpm de linux y el .zip de Mac) a la Release
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*
          overwrite: true
