name: Release Marmota

# Esto indica que el servidor solo arrancará cuando crees un Tag que empiece por 'v'
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Matriz de sistemas operativos: Linux, Windows, macOS
      matrix:
        os: [ ubuntu-22.04, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Wails en Linux necesita las cabeceras de GTK y WebKit para compilar
      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # En macOS, empaquetamos el .app indicando explicitamente que es Universal (Intel + Apple Silicon)
      - name: Build and Package Artifacts
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            wails build -platform darwin/universal
            cd build/bin
            zip -r Marmota_macOS_Universal.zip *.app
            rm -rf *.app

          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            wails build
            mv build/bin/Marmota.exe build/bin/Marmota_Windows_amd64.exe

          else
            # 1. Compilamos el binario base de Linux
            wails build

            # 2. Descargamos linuxdeploy (la herramienta oficial para crear AppImage)
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            chmod +x linuxdeploy-x86_64.AppImage

            # 3. Creamos el archivo .desktop (El "Acceso Directo" con metadatos que exige Linux)
            cat <<EOF > marmota.desktop
            [Desktop Entry]
            Name=Marmota
            Exec=Marmota
            Icon=appicon
            Type=Application
            Categories=Development;Network;Security;
            EOF

            # 4. Empaquetamos el binario, el icono y el .desktop en un solo archivo AppImage
            ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable build/bin/Marmota --desktop-file marmota.desktop --icon-file build/appicon.png --output appimage

            # 5. Renombramos el archivo final y limpiamos la basura
            mv Marmota*.AppImage build/bin/Marmota_Linux_amd64.AppImage
            rm build/bin/Marmota
          fi

      # Sube los binarios compilados (.exe, binario de linux y el .zip de Mac) a la Release
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*
