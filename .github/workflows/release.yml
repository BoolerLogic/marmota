name: Release Marmota

# Esto indica que el servidor solo arrancará cuando crees un Tag que empiece por 'v'
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Matriz de sistemas operativos: Linux, Windows, macOS
      matrix:
        os: [ ubuntu-22.04, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Wails en Linux necesita las cabeceras de GTK y WebKit para compilar
      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev imagemagick

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # 1. Compilación para Windows
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          wails build
          mv build/bin/Marmota.exe build/bin/Marmota_Windows_x64.exe

      # 2. Compilación para macOS (Universal)
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform darwin/universal
          cd build/bin
          zip -r Marmota_macOS_Universal.zip *.app
          rm -rf *.app

      # 3. Compilación y creación de AppImage para Linux
      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-22.04'
        run: |
          wails build

          # 1. Redimensionar y nombrar como 'marmota.png' para que coincida con el .desktop
          convert build/appicon.png -resize 512x512 build/marmota.png

          # 2. Descargar linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # 3. Crear archivo desktop con Icon=marmota
          echo -e "[Desktop Entry]\nName=Marmota\nExec=Marmota\nIcon=marmota\nType=Application\nCategories=Development;Network;Security;" > marmota.desktop

          # 4. Ejecutar empaquetado (Ahora el nombre del archivo y el del .desktop coinciden)
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable build/bin/Marmota --desktop-file marmota.desktop --icon-file build/marmota.png --output appimage

          mv Marmota*-x86_64.AppImage build/bin/Marmota_Linux_x64.AppImage
          rm build/bin/Marmota

      # Sube los binarios compilados (.exe, binario de linux y el .zip de Mac) a la Release
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*
