name: Release Marmota

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Matriz de sistemas operativos: Linux, Windows, macOS
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Wails en Linux necesita las cabeceras de GTK y WebKit para compilar
      - name: Install Linux System Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          if [ "${{ matrix.os }}" == "ubuntu-22.04" ]; then
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev imagemagick alien
          else
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev imagemagick alien
          fi

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # 1. Compilación para Windows
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          wails build
          mv build/bin/Marmota.exe "build/bin/Marmota_${{ github.ref_name }}_Windows_amd64.exe"

      # 2. Compilación para macOS (Universal)
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform darwin/universal
          cd build/bin
          zip -r "Marmota_${{ github.ref_name }}_macOS_Universal.zip" *.app
          rm -rf *.app

      # 3. Compilación nativa para Linux (.deb y .rpm)
      - name: Build Linux Native Packages
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          # Lógica dinámica para WebKit y Nomenclatura Profesional
          if [ "${{ matrix.os }}" == "ubuntu-22.04" ]; then
            wails build
            WEBKIT_DEP="libwebkit2gtk-4.0-37"
            SUFFIX="webkit4.0"
          else
            wails build -tags webkit2_41
            WEBKIT_DEP="libwebkit2gtk-4.1-0"
            SUFFIX="webkit4.1"
          fi

          mkdir -p deb_pkg/usr/bin
          mkdir -p deb_pkg/usr/share/applications
          mkdir -p deb_pkg/usr/share/icons/hicolor/512x512/apps
          mkdir -p deb_pkg/DEBIAN

          cp build/bin/Marmota deb_pkg/usr/bin/marmota
          convert build/appicon.png -resize 512x512 deb_pkg/usr/share/icons/hicolor/512x512/apps/marmota.png

          echo -e "[Desktop Entry]\nName=Marmota\nExec=/usr/bin/marmota\nIcon=marmota\nType=Application\nCategories=Development;Network;Security;" > deb_pkg/usr/share/applications/marmota.desktop

          # Inyectamos la dependencia en el archivo de control
          echo -e "Package: marmota\nVersion: ${VERSION}\nArchitecture: amd64\nMaintainer: Release Marmota <marmota@github.com>\nDescription: A cross-platform HTTP/HTTPS MITM proxy and network analyzer.\nDepends: ${WEBKIT_DEP}" > deb_pkg/DEBIAN/control

          # Nombre del DEB: marmota_x.y.z_linux_webkit4.1_amd64.deb
          DEB_NAME="marmota_${VERSION}_linux_${SUFFIX}_amd64.deb"
          dpkg-deb --build deb_pkg "build/bin/${DEB_NAME}"

          # Generar el RPM: marmota-x.y.z-linux-webkit4.1-1.x86_64.rpm
          cd build/bin
          sudo alien --to-rpm --scripts "${DEB_NAME}"
          mv *.rpm "marmota_${VERSION}_linux_${SUFFIX}_x86_64.rpm"
          rm Marmota

      # Sube los binarios compilados (.exe, .deb y .rpm de linux y el .zip de Mac) a la Release
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*
          overwrite: true
